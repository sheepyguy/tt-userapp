<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🖕Simon & Sheepy 🖕</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="tracker-app">
    <header id="drag-handle">
      <div class="drag-title">🖕Simon & Sheepy 🖕</div>
      <div id="session-timer" class="session-timer">—</div>
      <div id="settings-icon" title="Settings">⚙️</div>
    </header>
    <main>
      <section id="bxp-summary-section">
        <table id="bxp-summary-table">
          <thead>
            <tr>
              <th>Job</th>
              <th>EXP Token</th>
              <th>BXP/Hour</th>
              <th>BXP/Min</th>
              <th>Session Time</th>
            </tr>
          </thead>
          <tbody id="summary-tbody"></tbody>
        </table>
      </section>
      <div class="controls">
        <button id="reset-tracking">Reset All</button>
        <button id="toggle-auto-select">Auto-Select Active Jobs</button>
      </div>
    </main>
    <div id="resize-handle" title="Resize"></div>
  </div>

  <aside id="settings-panel" style="display:none;">
    <h3>Settings</h3>
    <label>
      <input type="checkbox" id="show-zero-bxp"> Show jobs with 0 BXP
    </label><br>
    <label>
      <input type="checkbox" id="auto-select-jobs" checked> Auto-select active jobs
    </label><br>
    <label>
      <input type="range" id="font-size" min="10" max="18" value="13" step="1" />
      Font Size: <span id="font-size-value">13</span>px
    </label><br>
    <button id="reload-button">🔄 Reload</button>
  </aside>
  <script src="script.js"></script>
</body>
</html>
